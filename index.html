<html>

<head>
    <title>Godforge AF Landing</title>
    <script src="https://onelinksmartscript.appsflyer.com/onelink-smart-script-latest.js"></script>

    <!-- Google Tag Manager -->
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start':
                    new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-TFFQRTM9');</script>
    <!-- End Google Tag Manager -->

</head>

<body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-TFFQRTM9" height="0" width="0"
            style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->

    <center>
        <h1> Godforge Landing Page Test </h1>
        <img src="logo.png" width="240" />

        <a href="#" id="dl_primary" style="display: block; margin-top: 20px;">Download Godforge</a>
        <br />
        <a href="#" id="dl_windows" style="display: block; margin-top: 20px;">Download PC </a>
        <a href="#" id="dl_macos" style="display: block; margin-top: 20px;">Download MacOS</a>
    </center>

    <script>
        (function () {
            console.log('Godforge AF page loaded');

            var ONELINK_TEMPLATE = "https://bcup-godforge-test.onelink.me/I0US"; // no cross-platform, beta 2 release

            var PC_APPS = {
                windows: {
                    platform: "nativepc",
                    app_id: "com.Godforge.Windows",
                    redirectURL: "https://godforge.stash.gg/download/windows/v0.8.0"
                },
                macos: {
                    platform: "nativepc",
                    app_id: "com.Godforge.MacOS",
                    redirectURL: "https://godforge.stash.gg/download/mac/v0.8.0"
                }
            };

            // Shared mapping. mediaSource and campaign MUST resolve or generateDirectClickURL
            // returns null, so both need a defaultValue.
            var afParameters = {
                mediaSource: { keys: ["utm_source", "pid"], defaultValue: "godforge_web" },
                campaign: { keys: ["utm_campaign", "c"], defaultValue: "godforge_landing" },
                channel: { keys: ["utm_medium", "af_channel"] },
                ad: { keys: ["utm_content", "af_ad"] },
                adSet: { keys: ["utm_term", "af_adset"] },
                googleClickIdKey: "af_sub4",
                afCustom: [
                    { paramKey: "af_xplatform", keys: [], defaultValue: "true" },
                    { paramKey: "gclid", keys: ["gclid"] },
                    { paramKey: "fbclid", keys: ["fbclid"] }
                ]
            };

            //  Generate OneLink URL with the af_xplatform set - we will remove that later
            var generateResult = window.AF_SMART_SCRIPT.generateOneLinkURL({
                oneLinkURL: ONELINK_TEMPLATE,
                afParameters: afParameters
            });

            if (!generateResult) {
                console.error("AF generateOneLinkURL failed. Returning.")
                return;
            }

            //  Remove af_xplatform to trigger the impression
            const indexToRemove = afParameters.afCustom.findIndex(
                (item) => item.paramKey === "af_xplatform"
            );
            if (indexToRemove !== -1) {
                afParameters.afCustom.splice(indexToRemove, 1);
            }

            console.log("AF Removed the af_xplatform from payload.");

            setTimeout(() => {
                window.AF_SMART_SCRIPT.fireImpressionsLink();
                console.log("AF impression fired");
            }, 1000);

            // 2. Desktop CTAs — one direct attribution link per PC app.
            //    af_xplatform must NOT be present here.
            var mobileURL = generateResult.clickURL;
            var links = { ios: mobileURL, android: mobileURL };

            Object.keys(PC_APPS).forEach(function (k) {
                var a = PC_APPS[k];
                var r = window.AF_SMART_SCRIPT.generateDirectClickURL({
                    afParameters: afParameters,
                    platform: a.platform,
                    app_id: a.app_id,
                    redirectURL: a.redirectURL
                });
                links[k] = r ? r.clickURL : a.redirectURL;   // never leave the button dead
                var el = document.getElementById("dl_" + k);
                if (el) el.setAttribute("href", links[k]);
            });

            // 4. OS detection for the hero button.
            var ua = navigator.userAgent;
            var plat = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
            var target =
                /android/i.test(ua) ? "android" :
                    /iPad|iPhone|iPod/.test(ua) ? "ios" :
                        (plat === "MacIntel" && navigator.maxTouchPoints > 1) ? "ios" : // iPadOS lies
                            /Win/i.test(plat) ? "windows" :
                                /Mac/i.test(plat) ? "macos" : "windows";

            console.log('Platform is :', target);

            var hero = document.getElementById("dl_primary");
            if (hero) hero.setAttribute("href", links[target]);
        })();
    </script>

</body>

</html>
